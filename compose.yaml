services:
  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    container_name: commerce-order-service
    environment:
      DB_URL: jdbc:postgresql://order-postgres:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: order_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      order-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  inventory-service:
    build:
      context: ../inventory-service
      dockerfile: Dockerfile
    container_name: commerce-inventory-service
    environment:
      DB_URL: jdbc:postgresql://inventory-postgres:5432/inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: inventory_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      inventory-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  order-postgres:
    image: postgres:17-alpine
    container_name: commerce-order-postgres
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5432:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U order_user -d order_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-postgres:
    image: postgres:17-alpine
    container_name: commerce-inventory-postgres
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5433:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U inventory_user -d inventory_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: commerce-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        INTERNAL://:29092,
        EXTERNAL://:9092,
        CONTROLLER://:29093

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  order_postgres_data:
  inventory_postgres_data:
  kafka_data: